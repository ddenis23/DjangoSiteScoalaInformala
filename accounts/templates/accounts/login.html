{% extends "base.html" %}

{% block title %}Autentificare{% endblock %}

{% block content %}

  <div class="row justify-content-center">
    <div class="col-md-4">
      <h1 class="mb-4">Autentificare</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100">Intra in cont</button>
      </form>
      <p class="mt-3 text-center">
        Nu ai cont? <a href="{% url 'register' %}">Inregistreaza-te</a>
      </p>
    </div>
  </div>

{% endblock %}
