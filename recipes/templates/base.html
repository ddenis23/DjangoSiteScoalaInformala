<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/main.css"/>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'recipe_list' %}">🍽️ Retete Culinare</a>

      <div class="d-flex gap-2 align-items-center flex-wrap">
        <a href="{% url 'recipe_list' %}" class="btn btn-outline-light btn-sm">Acasa</a>
        <a href="{% url 'recipe_list_by_date' %}" class="btn btn-outline-light btn-sm">Dupa data</a>
        <a href="{% url 'recipe_search' %}" class="btn btn-outline-light btn-sm">Cauta</a>
        {% if user.is_authenticated %}
          <a href="{% url 'recipe_add' %}" class="btn btn-light btn-sm">+ Adauga reteta</a>
          <span class="text-white">Salut, <strong>{{ user.username }}</strong></span>
          <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Delogare</a>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Autentificare</a>
          <a href="{% url 'register' %}" class="btn btn-light btn-sm">Inregistrare</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-3">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-warning">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
  </main>

</body>
</html>
